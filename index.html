<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sabina Somsa & Non Markazi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #c25927;
      --primary-hover: #a6471b;
      --bg: #f9f6f0;
      --card-bg: #ffffff;
      --text: #2d2621;
      --muted: #7a736e;
      --border: #ebdcd2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 95px;
    }

    header {
      background: var(--card-bg);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 19px;
      color: var(--primary);
      margin-bottom: 4px;
    }

    header p {
      font-size: 13px;
      color: var(--muted);
    }

    .container {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 16px 0 10px 0;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
    }

    .product-info h3 {
      font-size: 15px;
      margin-bottom: 4px;
    }

    .product-info p {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg);
      border-radius: 8px;
      padding: 4px 8px;
      border: 1px solid var(--border);
    }

    .counter button {
      background: none;
      border: none;
      font-size: 18px;
      font-weight: bold;
      color: var(--primary);
      width: 24px;
      height: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .counter span {
      font-size: 15px;
      font-weight: 700;
      min-width: 18px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      background: var(--card-bg);
      outline: none;
      color: var(--text);
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
      z-index: 20;
    }

    .total-price {
      font-size: 12px;
      color: var(--muted);
    }

    .total-price span {
      display: block;
      font-size: 18px;
      font-weight: 800;
      color: var(--primary);
    }

    .submit-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🥐 Sabina Somsa & Non Markazi</h1>
    <p>Issiq, barra taomlarga oldindan buyurtma bering</p>
  </header>

  <div class="container">
    <div class="section-title"><i class="fa-solid fa-utensils"></i> Taomnomamiz</div>
    <div class="product-list" id="products"></div>

    <div class="section-title"><i class="fa-solid fa-file-pen"></i> Buyurtmachi ma'lumotlari (Majburiy)</div>
    
    <div class="form-group">
      <label>Ismingiz *</label>
      <input type="text" id="custName" placeholder="Ismingizni yozing">
    </div>

    <div class="form-group">
      <label>Telefon raqamingiz *</label>
      <input type="tel" id="custPhone" value="+998" placeholder="+998901234567">
    </div>

    <div class="row-2">
      <div class="form-group">
        <label>Sana *</label>
        <input type="date" id="custDate">
      </div>
      <div class="form-group">
        <label>Soat (Vaqti) *</label>
        <input type="time" id="custTime">
      </div>
    </div>

    <div class="form-group">
      <label>Olib ketish usuli *</label>
      <select id="custMethod">
        <option value="Novvoyxonadan olib ketish">Novvoyxonadan olib ketish</option>
        <option value="Yetkazib berish (Dostavka)">Yetkazib berish (Dostavka)</option>
      </select>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="total-price">
      Jami summa:
      <span id="totalDisplay">0 UZS</span>
    </div>
    <button class="submit-btn" onclick="submitOrder()">
      <i class="fa-solid fa-paper-plane"></i> Buyurtma berish
    </button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const menuItems = [
      { id: "tandir_somsa", name: "Tandir go'shtli somsa", price: 7000 },
      { id: "qovurma_somsa", name: "Qatlama somsachalar", price: 6000 },
      { id: "kartoshka_somsa", name: "Kartoshkali somsa", price: 4000 },
      { id: "oshqovoq_somsa", name: "Oshqovoqli somsa", price: 4000 },
      { id: "patir_non", name: "Issiq Patir non", price: 6000 }
    ];

    let cart = {};

    // Bugungi sana va vaqtni avtomatik to'ldirish
    const now = new Date();
    document.getElementById('custDate').value = now.toISOString().split('T')[0];
    now.setMinutes(now.getMinutes() + 30);
    document.getElementById('custTime').value = now.toTimeString().slice(0, 5);

    function renderMenu() {
      const container = document.getElementById('products');
      container.innerHTML = menuItems.map(item => `
        <div class="product-card">
          <div class="product-info">
            <h3>${item.name}</h3>
            <p>${item.price.toLocaleString()} UZS</p>
          </div>
          <div class="counter">
            <button onclick="changeQty('${item.id}', -1)">-</button>
            <span id="qty_${item.id}">0</span>
            <button onclick="changeQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `).join('');
    }

    function changeQty(id, delta) {
      const current = cart[id] || 0;
      const next = current + delta;
      if (next <= 0) {
        delete cart[id];
      } else {
        cart[id] = next;
      }
      document.getElementById(`qty_${id}`).innerText = cart[id] || 0;
      updateTotal();
    }

    function updateTotal() {
      let total = 0;
      menuItems.forEach(item => {
        if (cart[item.id]) {
          total += cart[item.id] * item.price;
        }
      });
      document.getElementById('totalDisplay').innerText = total.toLocaleString() + " UZS";
      return total;
    }

    function submitOrder() {
      const total = updateTotal();
      if (total === 0) {
        return alert("Iltimos, avval kamida bitta mahsulot tanlang!");
      }

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const date = document.getElementById('custDate').value.trim();
      const time = document.getElementById('custTime').value.trim();
      const method = document.getElementById('custMethod').value;

      // MAJBURIY MAYDONLAR TEKSHIRUVI
      if (!name) return alert("Iltimos, ismingizni kiriting!");
      if (!phone || phone === "+998" || phone.length < 9) return alert("Iltimos, telefon raqamingizni to'liq kiriting!");
      if (!date) return alert("Iltimos, buyurtma sanasini belgilang!");
      if (!time) return alert("Iltimos, buyurtma soatini (vaqtini) belgilang!");

      let itemsText = "";
      let index = 1;
      menuItems.forEach(item => {
        if (cart[item.id]) {
          const sum = cart[item.id] * item.price;
          itemsText += `${index}. ${item.name} — ${cart[item.id]} ta x ${item.price.toLocaleString()} = ${sum.toLocaleString()} UZS\n`;
          index++;
        }
      });

      const prepay = Math.round(total * 0.5);
      const summaryText = 
        `👤 Mijoz: ${name}\n` +
        `📞 Tel: ${phone}\n` +
        `📦 Usul: ${method}\n` +
        `📅 Sana: ${date}\n` +
        `🕒 Soat: ${time}\n\n` +
        `📋 Mahsulotlar:\n${itemsText}\n` +
        `💰 Jami: ${total.toLocaleString()} UZS\n` +
        `💳 50% To'lov: ${prepay.toLocaleString()} UZS`;

      // TELEGRAM BOTGA YUBORISH VA OYNANI YOPISH
      if (tg && tg.sendData) {
        tg.sendData(summaryText);
        tg.close();
      } else {
        alert("Buyurtmangiz tayyorlandi! Telegram bot orqali ochilganda avtomatik yuboriladi.");
      }
    }

    renderMenu();
  </script>
</body>
</html>
